name: Apply GrowTell branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-growtell.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply GrowTell brand
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('GrowTell — Property Growth Scanner', 'Property Growth Scanner — by GrowTell')
          s = s.replace('<div class="brand">GrowTell <span style="color:#7dd3fc;font-weight:700">· Property Growth Scanner</span></div>', '<div class="brand">Property Growth Scanner <span style="display:block;color:#7dd3fc;font-size:10px;font-weight:700;margin-top:2px">by GrowTell</span></div>')
          s = s.replace('GROWTELL · PROPERTY GROWTH SCANNER', 'PROPERTY GROWTH SCANNER · BY GROWTELL')
          s = s.replace('GrowTell%20Early%20Access', 'Property%20Growth%20Scanner%20Early%20Access')
          s = s.replace('GrowTell%20early-access%20list', 'Property%20Growth%20Scanner%20by%20GrowTell%20early-access%20list')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Make Property Growth Scanner primary brand"
          git push
